<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Uploader</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #000000;
            color: #FAFAFA;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: #1A1A1A;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            padding: 40px;
            max-width: 500px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            color: #FFFFFF;
            margin-bottom: 10px;
            text-align: center;
            font-size: 2em;
            font-weight: 600;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.7);
            text-align: center;
            margin-bottom: 30px;
            font-size: 0.9em;
        }

        .upload-area {
            border: 2px dashed rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.05);
            margin-bottom: 20px;
        }

        .upload-area:hover {
            border-color: rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.08);
        }

        .upload-area.dragover {
            border-color: #FFFFFF;
            background: rgba(255, 255, 255, 0.1);
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 15px;
            color: #FFFFFF;
        }

        .upload-text {
            color: #FFFFFF;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .upload-hint {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.85em;
        }

        #fileInput {
            display: none;
        }

        .preview-container {
            margin-top: 20px;
            display: none;
        }

        .preview-container.active {
            display: block;
        }

        .preview-image {
            max-width: 100%;
            max-height: 300px;
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .file-info {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .file-info p {
            margin: 5px 0;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9em;
        }

        .file-info strong {
            color: #FFFFFF;
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: #FFFFFF;
            color: #000000;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.9);
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            background: rgba(255, 255, 255, 0.3);
            color: rgba(0, 0, 0, 0.5);
            cursor: not-allowed;
            transform: none;
        }

        .message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            display: none;
            text-align: center;
            font-weight: 500;
        }

        .message.success {
            background: rgba(40, 167, 69, 0.2);
            color: #28A745;
            border: 1px solid rgba(40, 167, 69, 0.4);
            display: block;
        }

        .message.error {
            background: rgba(220, 53, 69, 0.2);
            color: #DC3545;
            border: 1px solid rgba(220, 53, 69, 0.4);
            display: block;
        }

        .remove-btn {
            background: transparent;
            color: #FFFFFF;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
            margin-top: 10px;
            transition: all 0.2s ease;
        }

        .remove-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-image"></i> Image Uploader</h1>
        <p class="subtitle">Upload and save your images</p>

        <form id="uploadForm" enctype="multipart/form-data">
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon"><i class="fas fa-cloud-upload-alt"></i></div>
                <div class="upload-text">Click to select or drag & drop</div>
                <div class="upload-hint" id="uploadHint">Supports: JPG, PNG, GIF, WEBP (Max 5MB)</div>
                <input type="file" id="fileInput" name="image" accept="image/*" required>
            </div>

            <div class="preview-container" id="previewContainer">
                <img id="previewImage" class="preview-image" alt="Preview">
                <div class="file-info" id="fileInfo"></div>
                <button type="button" class="remove-btn" id="removeBtn"><i class="fas fa-times"></i> Remove Image</button>
            </div>

            <button type="submit" class="btn" id="submitBtn" disabled><i class="fas fa-upload"></i> Upload Image</button>
        </form>

        <div class="message" id="message"></div>
    </div>

    <script>
        // Configuration - Load from config.php via fetch or set manually
        const CONFIG = {
            maxFileSize: 5 * 1024 * 1024, // 5MB - Update to match config.php
            allowedExtensions: ['jpg', 'jpeg', 'png', 'gif', 'webp'],
            uploadEndpoint: 'uploader.php'
        };

        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const uploadForm = document.getElementById('uploadForm');
        const previewContainer = document.getElementById('previewContainer');
        const previewImage = document.getElementById('previewImage');
        const fileInfo = document.getElementById('fileInfo');
        const submitBtn = document.getElementById('submitBtn');
        const message = document.getElementById('message');
        const removeBtn = document.getElementById('removeBtn');
        const uploadHint = document.getElementById('uploadHint');

        // Update hint text based on config
        const maxSizeMB = Math.round(CONFIG.maxFileSize / (1024 * 1024));
        uploadHint.textContent = `Supports: ${CONFIG.allowedExtensions.join(', ').toUpperCase()} (Max ${maxSizeMB}MB)`;

        // Click to select file
        uploadArea.addEventListener('click', () => fileInput.click());

        // Drag and drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                fileInput.files = e.dataTransfer.files;
                handleFileSelect();
            }
        });

        // File input change
        fileInput.addEventListener('change', handleFileSelect);

        function handleFileSelect() {
            const file = fileInput.files[0];
            if (!file) return;

            // Validate file type
            if (!file.type.startsWith('image/')) {
                showMessage('Please select an image file.', 'error');
                fileInput.value = '';
                return;
            }

            // Validate file extension
            const fileExt = file.name.split('.').pop().toLowerCase();
            if (!CONFIG.allowedExtensions.includes(fileExt)) {
                showMessage(`File type not allowed. Allowed types: ${CONFIG.allowedExtensions.join(', ').toUpperCase()}`, 'error');
                fileInput.value = '';
                return;
            }

            // Validate file size
            if (file.size > CONFIG.maxFileSize) {
                const maxSizeMB = Math.round(CONFIG.maxFileSize / (1024 * 1024));
                showMessage(`File size must be less than ${maxSizeMB}MB.`, 'error');
                fileInput.value = '';
                return;
            }

            // Show preview
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImage.src = e.target.result;
                previewContainer.classList.add('active');
                submitBtn.disabled = false;

                // Show file info
                fileInfo.innerHTML = `
                    <p><strong><i class="fas fa-file-image"></i> File:</strong> ${file.name}</p>
                    <p><strong><i class="fas fa-weight"></i> Size:</strong> ${formatFileSize(file.size)}</p>
                    <p><strong><i class="fas fa-tag"></i> Type:</strong> ${file.type}</p>
                `;
            };
            reader.readAsDataURL(file);
            hideMessage();
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        // Remove selected file
        removeBtn.addEventListener('click', () => {
            fileInput.value = '';
            previewContainer.classList.remove('active');
            submitBtn.disabled = true;
            hideMessage();
        });

        // Form submission
        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(uploadForm);
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Uploading...';

            try {
                const response = await fetch(CONFIG.uploadEndpoint, {
                    method: 'POST',
                    body: formData
                });

                const text = await response.text();
                
                if (text.includes('uploaded') || response.ok) {
                    showMessage('Image uploaded successfully!', 'success');
                    setTimeout(() => {
                        fileInput.value = '';
                        previewContainer.classList.remove('active');
                        submitBtn.disabled = true;
                        submitBtn.innerHTML = '<i class="fas fa-upload"></i> Upload Image';
                    }, 2000);
                } else {
                    showMessage('Upload failed: ' + text, 'error');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fas fa-upload"></i> Upload Image';
                }
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Upload Image';
            }
        });

        function showMessage(text, type) {
            message.textContent = text;
            message.className = `message ${type}`;
        }

        function hideMessage() {
            message.className = 'message';
        }
    </script>
</body>
</html>
